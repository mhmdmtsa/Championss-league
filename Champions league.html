<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دوري أبطال أوروبا | الموسوعة التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b16;
    --gold:#f5c451;
    --gold-2:#e0a020;
    --blue:#2b6cff;
    --purple:#7b2ff7;
    --text:#e9eefb;
    --muted:#93a0bd;
    --border:rgba(255,255,255,.10);
    --card:rgba(255,255,255,.045);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}

  body{
    font-family:'Cairo', system-ui, -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.7;
  }

  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(circle at 15% 10%, rgba(123,47,247,.30), transparent 42%),
      radial-gradient(circle at 85% 15%, rgba(43,108,255,.25), transparent 42%),
      radial-gradient(circle at 50% 95%, rgba(245,196,81,.14), transparent 45%),
      #070b16;
  }

  /* ============ الهيدر ============ */
  .hero{
    position:relative;
    text-align:center;
    padding:70px 20px 40px;
  }

  .hero .badge-top{
    display:inline-block;
    font-size:.78rem;
    letter-spacing:1px;
    padding:7px 18px;
    border-radius:50px;
    border:1px solid rgba(245,196,81,.4);
    color:var(--gold);
    background:rgba(245,196,81,.08);
    margin-bottom:20px;
  }

  .hero h1{
    font-size:clamp(1.9rem, 5.5vw, 3.6rem);
    font-weight:900;
    line-height:1.3;
    background:linear-gradient(100deg,#f5c451 0%, #ffffff 45%, #7b2ff7 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:16px;
  }

  .hero p{
    max-width:640px;
    margin:0 auto;
    color:var(--muted);
    font-size:clamp(.9rem, 2.4vw, 1.05rem);
  }

  .stars{
    font-size:1.1rem;
    letter-spacing:8px;
    color:var(--gold);
    margin-top:18px;
    opacity:.85;
    animation:glow 3s ease-in-out infinite;
  }

  @keyframes glow{
    0%,100%{opacity:.5; text-shadow:0 0 0 transparent}
    50%{opacity:1; text-shadow:0 0 18px rgba(245,196,81,.7)}
  }

  /* ============ التبويبات ============ */
  .tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    max-width:1100px;
    margin:0 auto;
    padding:0 16px 26px;
  }

  .tab{
    font-family:inherit;
    font-size:.9rem;
    font-weight:700;
    color:var(--muted);
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    border-radius:50px;
    padding:10px 20px;
    cursor:pointer;
    transition:all .3s cubic-bezier(.4,0,.2,1);
  }

  .tab:hover{
    color:#fff;
    border-color:rgba(245,196,81,.5);
    transform:translateY(-2px);
  }

  .tab.active{
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#0a0e1a;
    border-color:transparent;
    box-shadow:0 8px 24px rgba(245,196,81,.30);
  }

  /* ============ البحث ============ */
  .search-wrap{
    position:relative;
    max-width:520px;
    margin:0 auto 34px;
    padding:0 16px;
  }

  .search-wrap input{
    width:100%;
    font-family:inherit;
    font-size:.98rem;
    color:#fff;
    background:rgba(255,255,255,.06);
    border:1px solid var(--border);
    border-radius:50px;
    padding:14px 50px 14px 20px;
    outline:none;
    transition:all .3s;
  }

  .search-wrap input::placeholder{color:#6d7a95}

  .search-wrap input:focus{
    border-color:var(--gold);
    background:rgba(255,255,255,.09);
    box-shadow:0 0 0 4px rgba(245,196,81,.10);
  }

  .search-wrap .ico{
    position:absolute;
    top:50%;
    right:34px;
    transform:translateY(-50%);
    opacity:.55;
    pointer-events:none;
  }

  /* ============ رأس القسم ============ */
  .sec-head{
    max-width:1200px;
    margin:0 auto 26px;
    padding:0 20px;
    text-align:center;
    animation:fadeUp .5s ease both;
  }

  .sec-head h2{
    font-size:clamp(1.3rem, 3.6vw, 1.9rem);
    font-weight:900;
    margin-bottom:8px;
  }

  .sec-head p{
    color:var(--muted);
    font-size:.92rem;
    max-width:680px;
    margin:0 auto;
  }

  /* ============ الشبكة والبطاقات ============ */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(265px, 1fr));
    gap:20px;
    max-width:1200px;
    margin:0 auto;
    padding:0 20px 70px;
  }

  .card{
    position:relative;
    overflow:hidden;
    background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.018));
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px 20px 20px;
    transition:transform .35s cubic-bezier(.4,0,.2,1), box-shadow .35s, border-color .35s;
    animation:fadeUp .5s ease both;
    backdrop-filter:blur(6px);
  }

  .card::after{
    content:'';
    position:absolute;
    top:0; right:0; left:0;
    height:3px;
    background:linear-gradient(90deg, var(--gold), var(--purple));
    opacity:0;
    transition:opacity .35s;
  }

  .card:hover{
    transform:translateY(-7px);
    border-color:rgba(245,196,81,.35);
    box-shadow:0 20px 45px rgba(0,0,0,.5);
  }

  .card:hover::after{opacity:1}

  .card-num{
    position:absolute;
    top:8px;
    left:14px;
    font-size:3.2rem;
    font-weight:900;
    color:rgba(255,255,255,.045);
    line-height:1;
    pointer-events:none;
    user-select:none;
  }

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }

  .card-icon{
    font-size:1.7rem;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.5));
  }

  .card-badge{
    font-size:.74rem;
    font-weight:700;
    color:var(--gold);
    background:rgba(245,196,81,.10);
    border:1px solid rgba(245,196,81,.28);
    border-radius:50px;
    padding:4px 12px;
    white-space:nowrap;
  }

  .card-title{
    font-size:1.12rem;
    font-weight:800;
    margin-bottom:4px;
    color:#fff;
  }

  .card-meta{
    font-size:.8rem;
    color:var(--gold);
    opacity:.85;
    margin-bottom:10px;
    font-weight:600;
  }

  .card-desc{
    font-size:.86rem;
    color:var(--muted);
    line-height:1.85;
  }

  /* ============ النظرة العامة ============ */
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
    gap:16px;
    max-width:1200px;
    margin:0 auto 40px;
    padding:0 20px;
  }

  .stat{
    text-align:center;
    padding:24px 14px;
    border-radius:18px;
    border:1px solid var(--border);
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.015));
    transition:transform .3s, border-color .3s;
    animation:fadeUp .5s ease both;
  }

  .stat:hover{
    transform:translateY(-5px);
    border-color:rgba(245,196,81,.4);
  }

  .stat-num{
    font-size:clamp(1.8rem, 5vw, 2.5rem);
    font-weight:900;
    background:linear-gradient(135deg,var(--gold),#fff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1.2;
  }

  .stat-label{
    font-size:.82rem;
    color:var(--muted);
    margin-top:6px;
  }

  .stat-label small{
    display:block;
    color:#fff;
    font-weight:700;
    font-size:.86rem;
    margin-top:2px;
  }

  .intro{
    max-width:900px;
    margin:0 auto 46px;
    padding:28px 26px;
    border-radius:20px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
    animation:fadeUp .5s ease both;
  }

  .intro h2{
    font-size:1.3rem;
    font-weight:900;
    margin-bottom:14px;
    color:var(--gold);
  }

  .intro p{
    color:#c3cde3;
    font-size:.93rem;
    margin-bottom:12px;
  }

  .intro p:last-child{margin-bottom:0}

  .quick-title{
    text-align:center;
    font-size:1.2rem;
    font-weight:900;
    margin-bottom:20px;
  }

  .quick-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    max-width:900px;
    margin:0 auto 70px;
    padding:0 20px;
  }

  .quick-btn{
    font-family:inherit;
    font-size:.9rem;
    font-weight:700;
    color:var(--text);
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 22px;
    cursor:pointer;
    transition:all .3s;
  }

  .quick-btn:hover{
    background:linear-gradient(135deg, rgba(245,196,81,.18), rgba(123,47,247,.18));
    border-color:rgba(245,196,81,.5);
    transform:translateY(-3px);
  }

  /* ============ لا نتائج ============ */
  .empty{
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
    animation:fadeUp .4s ease both;
  }

  .empty .big{font-size:3rem; display:block; margin-bottom:14px}

  /* ============ الفوتر ============ */
  footer{
    text-align:center;
    padding:34px 20px 44px;
    border-top:1px solid var(--border);
    color:var(--muted);
    font-size:.82rem;
  }

  footer span{color:var(--gold); font-weight:700}

  /* ============ حركات ============ */
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(18px)}
    to{opacity:1; transform:translateY(0)}
  }

  /* ============ استجابة ============ */
  @media (max-width:520px){
    .hero{padding:48px 16px 30px}
    .tab{font-size:.82rem; padding:9px 15px}
    .grid{grid-template-columns:1fr; gap:16px}
    .card-num{font-size:2.4rem}
  }
</style>
</head>

   2) الإعدادات والأقسام
   ========================================================= */

/* =========================================================
   3) الحالة
   ========================================================= */

const state = { tab:'overview', q:'' };

const contentEl  = document.getElementById('content');
const tabsEl     = document.getElementById('tabs');
const searchWrap = document.getElementById('searchWrap');
const searchInput= document.getElementById('searchInput');

/* =========================================================
   4) بناء التبويبات
   ========================================================= */

function buildTabs(){
  tabsEl.innerHTML = TABS.map(t => `
    <button class="tab ${t.id === state.tab ? 'active' : ''}" data-tab="${t.id}">
      ${t.icon} ${t.label}
    </button>
  `).join('');
}

tabsEl.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if(!btn) return;
  state.tab = btn.dataset.tab;
  state.q = '';
  searchInput.value = '';
  buildTabs();
  render();
  window.scrollTo({ top: 0, behavior:'smooth' });
});

/* =========================================================
   5) البحث
   ========================================================= */

searchInput.addEventListener('input', e => {
  state.q = e.target.value;
  render();
});

/* =========================================================
   6) النظرة العامة
   ========================================================= */

/* =========================================================
   7) بطاقات الأقسام
   ========================================================= */

function cardsHTML(list){
  return list.map((it, i) => `
    <article class="card" style="animation-delay:${Math.min(i*45, 450)}ms">
      <span class="card-num">${String(i+1).padStart(2,'0')}</span>
      <div class="card-top">
        <span class="card-icon">${it.icon || '⭐'}</span>
        ${it.badge ? `<span class="card-badge">${it.badge}</span>` : ''}
      </div>
      <h3 class="card-title">${it.name}</h3>
      ${it.meta ? `<p class="card-meta">${it.meta}</p>` : ''}
      <p class="card-desc">${it.desc}</p>
    </article>
  `).join('');
}

/* =========================================================
   8) العدّاد المتحرك
   ========================================================= */

function animateCounters(){
  document.querySelectorAll('.stat-num[data-target]').forEach(el => {
    const target = parseInt(el.dataset.target, 10);
    const step = Math.max(1, Math.ceil(target / 35));
    let current = 0;

    const timer = setInterval(() => {
      current += step;
      if(current >= target){
        current = target;
        clearInterval(timer);
      }
      el.textContent = current;
    }, 28);
  });
}

/* =========================================================
   9) الرسم الرئيسي
   ========================================================= */

function render(){
  const q = state.q.trim().toLowerCase();

  /* --- النظرة العامة --- */
  if(state.tab === 'overview'){
    searchWrap.style.display = 'none';
    contentEl.innerHTML = overviewHTML();
    animateCounters();
    return;
  }

  searchWrap.style.display = 'block';
  const section = SECTIONS[state.tab];

  /* --- التصفية --- */
  const list = section.data.filter(it => {
    if(!q) return true;
    const haystack = [it.name, it.meta, it.desc, it.badge]
      .filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  });

  const head = `
    <div class="sec-head">
      <h2>${section.title}</h2>
      <p>${section.sub}</p>
    </div>`;

  if(list.length === 0){
    contentEl.innerHTML = head + `
      <div class="empty">
        <span class="big">🔍</span>
        <p>لا توجد نتائج مطابقة لـ «${state.q}»</p>
      </div>`;
    return;
  }

  contentEl.innerHTML = head + `<div class="grid">${cardsHTML(list)}</div>`;
}

/* =========================================================
   10) أزرار «اكتشف الأقسام» داخل النظرة العامة
   ========================================================= */

contentEl.addEventListener('click', e => {
  const btn = e.target.closest('.quick-btn');
  if(!btn) return;
  state.tab = btn.dataset.tab;
  state.q = '';
  searchInput.value = '';
  buildTabs();
  render();
  window.scrollTo({ top: 0, behavior:'smooth' });
});

/* =========================================================
   11) الإقلاع
   ========================================================= */

buildTabs();
render();
</script>
